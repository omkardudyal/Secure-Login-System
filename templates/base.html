<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Secure Login{% endblock %}</title>
  <style>
    :root { color-scheme: light; --navy:#101828; --blue:#315eea; --muted:#667085; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif; background:#f3f6fb; color:var(--navy); }
    header { background:white; border-bottom:1px solid #e5eaf2; padding:18px 6%; display:flex; justify-content:space-between; align-items:center; }
    .brand { font-size:1.25rem; font-weight:800; color:var(--blue); text-decoration:none; }
    nav a { margin-left:18px; text-decoration:none; color:#344054; font-weight:600; }
    main { width:min(92%,480px); margin:48px auto; }
    .card { background:white; padding:30px; border:1px solid #e5eaf2; border-radius:18px; box-shadow:0 12px 35px #1018280b; }
    h1 { margin-top:0; font-size:1.8rem; letter-spacing:-.03em; }
    p { color:var(--muted); line-height:1.6; }
    label { display:block; font-weight:650; margin:16px 0 7px; }
    input { width:100%; padding:12px 13px; border:1px solid #d0d5dd; border-radius:9px; font:inherit; }
    input:focus { outline:3px solid #315eea25; border-color:var(--blue); }
    button,.button { display:inline-block; border:0; border-radius:9px; padding:12px 17px; margin-top:20px; background:var(--blue); color:white; font:inherit; font-weight:700; text-decoration:none; cursor:pointer; }
    button:hover,.button:hover { filter:brightness(.94); }
    .secondary { background:#eef2ff; color:#294bc4; }
    .flash { padding:12px 14px; border-radius:9px; margin-bottom:12px; }
    .success { background:#e8f8ef; color:#17663b; } .danger { background:#fff0f0; color:#a12626; } .warning { background:#fff6df; color:#805b00; }
    .small { font-size:.9rem; } .row { display:flex; gap:10px; flex-wrap:wrap; }
    footer { text-align:center; color:#98a2b3; font-size:.85rem; padding:20px; }
  </style>
</head>
<body>
<header>
  <a class="brand" href="{{ url_for('index') }}">SecureGate</a>
  <nav>
    {% if session.get('user_id') %}
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <form action="{{ url_for('logout') }}" method="post" style="display:inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="secondary" style="margin:0;padding:8px 12px" type="submit">Log out</button>
      </form>
    {% else %}
      <a href="{{ url_for('login') }}">Log in</a>
      <a href="{{ url_for('register') }}">Register</a>
    {% endif %}
  </nav>
</header>
<main>
  {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ category }}">{{ message }}</div>
  {% endfor %}
  <section class="card">{% block content %}{% endblock %}</section>
</main>
<footer>SecureGate · Demonstration project for learning secure authentication</footer>
</body>
</html>
